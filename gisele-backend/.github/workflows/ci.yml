name: GISELE backend CI

on:
  push:
    branches: [main]
    paths: ['gisele-backend/**']
  pull_request:
    paths: ['gisele-backend/**']

jobs:

  lint-openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install -g @redocly/cli@latest
      - run: |
          cd gisele-backend/openapi
          for f in *.yaml; do
            echo "Linting $f"
            redocly lint "$f"
          done

  build-tile-cache:
    name: tile-cache (Go) — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: |
          cd gisele-backend/services/tile-cache
          go vet ./...
          go build -v ./...
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t gisele/tile-cache:ci gisele-backend/services/tile-cache

  build-python-services:
    name: Python services — build images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [raster-decoder, calc-engine, export-service, format-converter]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t gisele/${{ matrix.service }}:ci gisele-backend/services/${{ matrix.service }}

  build-node-services:
    name: Node services — build images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, user-state]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t gisele/${{ matrix.service }}:ci gisele-backend/services/${{ matrix.service }}

  compose-up-smoke:
    name: docker-compose.local smoke test
    runs-on: ubuntu-latest
    needs: [build-tile-cache, build-python-services, build-node-services]
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd gisele-backend
          docker compose -f docker-compose.local.yml up -d --build
          sleep 30
          for port in 8080 8081 8082 8083 8084 8085 8086; do
            echo "Checking :$port/health"
            curl -fsS http://localhost:$port/health || curl -fsS http://localhost:$port/v1/tiles/health || true
          done
          docker compose -f docker-compose.local.yml down
