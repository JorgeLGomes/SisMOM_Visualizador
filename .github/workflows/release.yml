name: Build & Release

on:
  push:
    tags: ['v*']      # ex.: v1.0.0
  workflow_dispatch:   # permite rodar manualmente pelo Actions

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    defaults:
      run:
        working-directory: electron-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Windows (.exe)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Build Linux (AppImage / .deb)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sismom-${{ matrix.os }}
          path: |
            electron-app/dist/*.exe
            electron-app/dist/*.AppImage
            electron-app/dist/*.deb
            electron-app/dist/*.blockmap
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            electron-app/dist/*.exe
            electron-app/dist/*.AppImage
            electron-app/dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
